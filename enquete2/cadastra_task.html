<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cadastra Task</title>
</head>
<body>
    <h3>Cadastro de Task</h3>
    <form id="form">
        <p>Título: <input type="text" name="titulo" id="titulo"/></p>
        <p>Descricao: <textarea name="descricao" id="descricao"></textarea></p>
        <p>Data de conclusão: <input type="date" name="data" id="data" /></p>
        <p>Prioridade:
            <br/><input type="radio" name="prioridade" id="prio_alta" value="ALTA" /> Alta
            <br/><input type="radio" name="prioridade" id="prio_media" value="MEDIA" /> Média
            <br/><input type="radio" name="prioridade" id="prio_baixa" value="BAIXA" /> Baixa
        </p>
        <p>Status:
            <br/><input type="radio" name="status" id="st_aberta" value="ABERTA" /> Aberta
            <br/><input type="radio" name="status" id="st_andamento" value="ANDAMENTO" /> Andamento
            <br/><input type="radio" name="status" id="st_finalizada" value="FINALIZADA" /> Finalizada
        </p>
        <p><input type="button" name="enviar" value="enviar" id="bt_enviar"  /></p>
    </form>
    <div id="resultado"></div>
</body>
<script type="text/javascript">
    async function enviarDados(dados) {
        try {
            const resposta = await fetch('http://localhost:8080/api/v1/tasks', {
                         method: 'POST',
                         headers: {'Content-Type': 'application/json'},
                         body: JSON.stringify(dados)
            })
            if (!resposta.ok) {
                  throw new Error(`Erro na requisição: ${resposta.status}`)
            }
            const resultado = await resposta.json()
            return resultado
        } catch (erro) {
            console.error('Falha ao enviar:', erro);
        }
    }

    botao = document.getElementById("bt_enviar")
    botao.addEventListener('click', () => {
        dados = {}
        dados['titulo'] = document.getElementById('titulo').value
        dados['descricao'] = document.getElementById('descricao').value
        dados['status'] = document.querySelector('input[name="status"]:checked')?.value
        dados['prioridade'] = document.querySelector('input[name="prioridade"]:checked')?.value
        dados['data'] = document.getElementById('data').value
        const div = document.getElementById('resultado')
        enviarDados(dados)
            .then(resposta => {
                if (resposta) {
                    div.innerHTML = JSON.stringify(resposta, null, 2);
                }
            });
    })
</script>
</html>
